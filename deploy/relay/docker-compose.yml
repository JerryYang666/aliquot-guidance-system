# The realtime relay behind Caddy, which obtains and renews the TLS
# certificate for RELAY_DOMAIN automatically. The relay image is built and
# published by CI on every push to main; this host only pulls it.
# See docs/deploy.md.
services:
  relay:
    image: ghcr.io/jerryyang666/aliquot-guidance-system/realtime:${RELAY_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      RELAY_SECRET: ${RELAY_SECRET:?set RELAY_SECRET in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    expose:
      - "8081"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
